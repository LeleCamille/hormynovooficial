<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hormy - Cadastro de Hortaliças</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <main class="container">
        <h1>🌱 Hormy</h1>
        <h2>Cadastro de Hortaliças</h2>

        <p>Cadastre uma nova hortaliça no sistema.</p>

        {% with mensagens = get_flashed_messages(with_categories=true) %}
            {% for categoria, mensagem in mensagens %}
                <div class="{{ categoria }}">{{ mensagem }}</div>
            {% endfor %}
        {% endwith %}

        <form action="{{ url_for('hortalica.cadastrar_hortalica') }}" method="POST">

            <label for="nome">Nome da hortaliça:</label>
            <input type="text" id="nome" name="nome" required>

            <label for="especie">Espécie:</label>
            <input type="text" id="especie" name="especie">

            <label for="descricao">Descrição:</label>
            <textarea id="descricao" name="descricao" rows="4"></textarea>

            <button type="submit">Cadastrar hortaliça</button>

        </form>
    </main>

</body>
</html>
